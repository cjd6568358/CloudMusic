<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>具身智能全流程管理系统</title>
<style>
:root{
  --ink:#0e1c30; --ink2:#15294a; --rail-text:#c3d0e4; --rail-dim:#7188ab;
  --paper:#ffffff; --mist:#f2f5fa; --line:#dbe4ef;
  --blue:#2f6bf0; --blue-deep:#1f4fc4; --blue-soft:#e8effc;
  --text:#1f2d3d; --text2:#5b6b80;
  --green:#1f9d55; --green-soft:#e5f5ec;
  --amber:#b96f0e; --amber-soft:#fdf3e3;
  --red:#d64545; --red-soft:#fcebea;
  --gray-soft:#eef1f6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI","Noto Sans SC",sans-serif;background:var(--mist);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ===== 布局骨架 ===== */
#app{display:flex;min-height:100vh}
#rail{width:216px;flex-shrink:0;background:linear-gradient(180deg,var(--ink) 0%,var(--ink2) 100%);color:var(--rail-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .mark{display:inline-flex;align-items:center;gap:8px}
.brand .sq{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#2f6bf0,#4f8ef7);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:.5px}
.brand b{display:block;color:#fff;font-size:14px;letter-spacing:.5px;margin-top:10px;font-weight:700}
.brand span{display:block;font-size:11px;color:var(--rail-dim);letter-spacing:2px;margin-top:2px}
nav#nav{flex:1;padding:10px 0}
.nav-item{display:flex;align-items:center;width:100%;padding:9px 18px 9px 14px;color:var(--rail-text);font-size:13px;gap:8px;border-left:3px solid transparent;transition:background .15s,color .15s;text-align:left}
.nav-item .no{font-size:10px;color:var(--rail-dim);width:20px;flex-shrink:0;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.nav-item .lb{flex:1}
.nav-item .ct{font-size:10px;background:rgba(255,255,255,.09);border-radius:999px;padding:1px 7px;color:#a8b8d0;font-variant-numeric:tabular-nums}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(47,107,240,.22);border-left-color:var(--blue);color:#fff}
.nav-item.active .no{color:#9db7f5}
.nav-sep{margin:8px 18px;border-top:1px solid rgba(255,255,255,.08)}
.rail-foot{padding:12px 18px;font-size:10px;color:var(--rail-dim);border-top:1px solid rgba(255,255,255,.08);line-height:1.7}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:20px 26px 14px;background:var(--mist);flex-wrap:wrap}
#topbar h1{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:.3px}
#topbar .sub{font-size:12px;color:var(--text2);margin-top:2px}
#view-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#content{padding:0 26px 34px;flex:1}

/* ===== 通用元件 ===== */
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--text);transition:all .15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-deep);color:#fff;border-color:var(--blue-deep)}
.btn-danger{background:var(--paper);border:1px solid var(--line);color:var(--red)}
.btn-danger:hover{border-color:var(--red)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:7px}
.search{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:220px;transition:border .15s}
.search:focus{border-color:var(--blue);outline:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:12px;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between}
.card h3 .hint{font-size:11px;font-weight:400;color:var(--text2)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.kpi .num{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.kpi .num small{font-size:12px;font-weight:600;color:var(--text2);margin-left:2px}
.kpi .lab{font-size:11px;color:var(--text2);margin-top:3px}
.kpi.warn::after{background:var(--amber)} .kpi.danger::after{background:var(--red)} .kpi.good::after{background:var(--green)}

/* 漏斗 */
.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.funnel-row .fl{width:72px;font-size:12px;color:var(--text2);flex-shrink:0;text-align:right}
.funnel-row .fbar{flex:1;height:20px;background:var(--gray-soft);border-radius:5px;overflow:hidden}
.funnel-row .fbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6bf0,#4f8ef7);border-radius:5px;min-width:2px}
.funnel-row .fv{width:34px;font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--text2);padding:9px 10px;border-bottom:1px solid var(--line);letter-spacing:.4px;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--mist)}
.tbl td.ta{white-space:nowrap;text-align:right}
.tbl .lnk{font-size:12px;color:var(--blue);padding:2px 6px;border-radius:6px}
.tbl .lnk:hover{background:var(--blue-soft)}
.tbl .lnk.danger{color:var(--red)}
.tbl .lnk.danger:hover{background:var(--red-soft)}
.tbl td .dim{color:var(--text2);font-size:12px}

/* 状态胶囊 */
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-blue{background:var(--blue-soft);color:var(--blue-deep)}
.c-green{background:var(--green-soft);color:var(--green)}
.c-amber{background:var(--amber-soft);color:var(--amber)}
.c-red{background:var(--red-soft);color:var(--red)}
.c-gray{background:var(--gray-soft);color:var(--text2)}

/* 标签页 */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--text2);border:1px solid transparent}
.tab.on{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,28,48,.06)}
.tab:hover{color:var(--ink)}

/* 提示横幅/空状态/列表 */
.banner{background:var(--blue-soft);border:1px solid #bfd2f4;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.banner button{color:var(--blue-deep);font-weight:600;font-size:12px}
.empty{padding:34px 20px;text-align:center;color:var(--text2);font-size:13px;background:var(--paper);border:1px dashed var(--line);border-radius:12px}
.plain-list{list-style:none}
.plain-list li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.plain-list li:last-child{border-bottom:none}
.plain-list .d{color:var(--text2);font-size:12px;flex-shrink:0;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* 模态框 */
#modal-root .overlay{position:fixed;inset:0;background:rgba(14,28,48,.48);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto;animation:fade .15s ease}
.dialog{background:var(--paper);border-radius:14px;width:min(600px,94vw);max-height:82vh;overflow-y:auto;box-shadow:0 12px 40px rgba(14,28,48,.25);animation:pop .18s ease}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;color:var(--ink)}
.dlg-head .x{color:var(--text2);font-size:15px;padding:2px 8px;border-radius:6px}
.dlg-head .x:hover{background:var(--gray-soft);color:var(--ink)}
.dlg-body{padding:18px 20px}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--mist);border-radius:0 0 14px 14px}
.fld{display:block;margin-bottom:13px}
.fld>span{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(47,107,240,.12)}
.fld textarea{min-height:72px;resize:vertical;line-height:1.6}
.fld .dl-hint{font-size:11px;color:var(--text2);font-weight:400;margin-top:3px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid .full{grid-column:1/-1}
.note{font-size:12px;color:var(--text2);line-height:1.8;padding:10px 14px;background:var(--gray-soft);border-radius:8px}
.warn-note{background:var(--amber-soft);color:#7c4a06;border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.8}

/* Toast */
#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;font-size:13px;padding:9px 18px;border-radius:9px;box-shadow:0 6px 24px rgba(14,28,48,.35);animation:pop .2s ease}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* 响应式 */
@media (max-width:900px){
  #app{flex-direction:column}
  #rail{width:100%;height:auto;position:static}
  nav#nav{display:flex;overflow-x:auto;padding:6px 8px}
  .nav-item{border-left:none;border-bottom:3px solid transparent;border-radius:6px;white-space:nowrap;padding:7px 10px}
  .nav-item.active{border-bottom-color:var(--blue)}
  .nav-sep{display:none}
  .brand{display:none}
  .rail-foot{display:none}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="brand">
      <div class="mark"><span class="sq">EI</span><span style="font-size:11px;color:#8ea3c6;letter-spacing:1px">EMBODIED&nbsp;INTELLIGENCE</span></div>
      <b>具身智能</b><span>全流程管理系统</span>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">01 情报 → 08 复盘<br>全流程闭环 · 数据存于本机</div>

  <main id="main">
    <header id="topbar">
      <div><h1 id="view-title"></h1><div class="sub" id="view-sub"></div></div>
      <div id="view-actions"></div>

    <div id="content"><div id="banner"></div><section id="view"></section></div>

</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>

/* ================= 通用UI基建 ================= */
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toast-root').appendChild(t);setTimeout(function(){t.remove();},2200);}
function closeModal(){$('#modal-root').innerHTML='';}
function confirmBox(msg,cb,danger){
  pendingConfirm=cb;
  $('#modal-root').innerHTML='<div class="overlay" data-action="confirm-no"><div class="dialog" style="width:min(420px,94vw)"><div class="dlg-head"><span>请确认</span><button class="x" data-action="confirm-no">✕</button></div><div class="dlg-body" style="font-size:13px;line-height:1.8">'+esc(msg)+'</div><div class="dlg-foot"><button class="btn" data-action="confirm-no">取消</button><button class="btn '+(danger?'btn-danger':'btn-primary')+'" data-action="confirm-yes">确定</button></div></div></div>';
}
function tableHTML(cols,rows,acts){
  var h='<table class="tbl"><thead><tr>'+cols.map(function(c){return '<th'+(c.w?' style="width:'+c.w+'"':'')+'>'+c.label+'</th>';}).join('')+(acts?'<th></th>':'')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr>'+cols.map(function(c){return '<td>'+(c.render?c.render(r):((r[c.key]!=null&&r[c.key]!=='')?esc(r[c.key]):'<span class="dim">—</span>'))+'</td>';}).join('')+(acts?'<td class="ta">'+acts(r)+'</td>':'')+'</tr>';
  });
  return h+'</tbody></table>';
}
function emptyHTML(text){return '<div class="empty">'+esc(text)+'</div>';}
function rowActs(r){return '<button class="lnk" data-action="edit" data-id="'+r.id+'">编辑</button> <button class="lnk danger" data-action="del" data-id="'+r.id+'">删除</button>';}
function datalistsHTML(fields){
  var names=fields.filter(function(f){return f.type==='datalist';}).map(function(f){return f.list;});
  if(!names.length)return '';
  return names.map(function(list){
    var opts=[];
    if(list==='dl-projects')opts=db.projects.map(function(p){return p.name;});
    if(list==='dl-assets')opts=db.assets.map(function(a){return a.sn?a.sn+'｜'+a.model:'';}).filter(Boolean);
    return '<datalist id="'+list+'">'+opts.map(function(o){return '<option value="'+esc(o)+'">';}).join('')+'</datalist>';
  }).join('');
}
function openForm(fields,row,opts){
  opts=opts||{};
  formCtx={fields:fields,editId:row?row.id:null,opts:opts};
  var v=function(k){return row?(row[k]==null?'':row[k]):'';};
  var f='';
  fields.forEach(function(fd){
    var val=v(fd.key),input='';
    if(fd.type==='select'){
      input='<select name="'+fd.key+'">'+fd.options.map(function(o,i){var sel=(val?String(val)===o:i===0);return '<option value="'+esc(o)+'"'+(sel?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
    }else if(fd.type==='textarea'){
      input='<textarea name="'+fd.key+'" placeholder="'+esc(fd.placeholder||'')+'"'+(fd.rows?' rows="'+fd.rows+'"':'')+'>'+esc(val)+'</textarea>';
    }else if(fd.type==='datalist'){
      input='<input name="'+fd.key+'" list="'+fd.list+'" value="'+esc(val)+'" placeholder="'+esc(fd.placeholder||'')+'" autocomplete="off">';
    }else{
      input='<input name="'+fd.key+'" type="'+(fd.type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(fd.placeholder||'')+'"'+(fd.type==='number'?' step="any"':'')+'>';
    }
    var wide=fd.wide||fd.type==='textarea';
    f+='<label class="fld'+(wide?' full':'')+'"><span>'+esc(fd.label)+(fd.required?' *':'')+(fd.hint?'<i class="dl-hint" style="font-style:normal">'+esc(fd.hint)+'</i>':'')+'</span>'+input+'</label>';
  });
  $('#modal-root').innerHTML='<div class="overlay" data-action="close"><div class="dialog"><div class="dlg-head"><span>'+esc(opts.title||(row?'编辑记录':'新增记录'))+'</span><button class="x" data-action="close">✕</button></div><div class="dlg-body"><form id="mform" class="fgrid" onsubmit="return false">'+f+'</form>'+datalistsHTML(fields)+'</div><div class="dlg-foot"><button class="btn" data-action="close">取消</button><button class="btn btn-primary" data-action="save">保存</button></div></div></div>';
  var first=$('#mform').querySelector('input,select,textarea');if(first)first.focus();
}
function saveForm(){
  var m=currentModule(),col=modColKey(m);
  if(!col||!formCtx){closeModal();return;}
  var obj={},els=$$('#mform [name]');
  els.forEach(function(el){obj[el.name]=typeof el.value==='string'?el.value.trim():el.value;});
  formCtx.fields.forEach(function(fd){if(fd.type==='number')obj[fd.key]=obj[fd.key]===''?'':Number(obj[fd.key]);});
  if(formCtx.opts.beforeSave)formCtx.opts.beforeSave(obj);
  if(formCtx.editId){
    var i=db[col].findIndex(function(x){return x.id===formCtx.editId;});
    if(i>-1){db[col][i]=Object.assign({},db[col][i],obj);}
  }else{
    obj.id=uid();obj.created=new Date().toISOString();
    if(formCtx.opts.defaults)Object.assign(obj,formCtx.opts.defaults);
    db[col].unshift(obj);
  }
  save();closeModal();refresh();toast(formCtx.editId?'已保存修改':'已新增');
}

/* ================= 路由与渲染骨架 ================= */
function currentModule(){return MODULES.filter(function(m){return m.key===view;})[0];}
function modColKey(m){return typeof m.collection==='function'?m.collection():(m.collection||null);}
function modFields(m){return typeof m.fields==='function'?m.fields():m.fields;}
function curCollection(){var k=modColKey(currentModule());return k?db[k]:[];}
function searchKey(){return view==='intel'?('intel:'+intelTab):view;}
function onSearch(v){q[searchKey()]=v;renderView();var s=$('#view .search');if(s){s.focus();var len=s.value.length;s.setSelectionRange(len,len);}}
function go(key){view=key;renderNav();renderView();}
function refresh(){renderNav();renderView();}
function renderNav(){
  var h='';
  MODULES.forEach(function(m){
    if(m.key==='settings')h+='<div class="nav-sep"></div>';
    var ct=m.count?m.count():null;
    h+='<button class="nav-item'+(view===m.key?' active':'')+'" data-action="nav" data-nav="'+m.key+'"><span class="no">'+(m.no||'')+'</span><span class="lb">'+esc(m.nav)+'</span>'+(ct!=null?'<span class="ct">'+ct+'</span>':'')+'</button>';
  });
  $('#nav').innerHTML=h;
}
function renderTopbar(){
  var m=currentModule();
  $('#view-title').textContent=m.title;
  $('#view-sub').textContent=m.sub;
  var acts='';
  var addLabel=typeof m.addLabel==='function'?m.addLabel():m.addLabel;
  if(addLabel)acts+='<button class="btn btn-primary" data-action="add">＋ '+esc(addLabel)+'</button>';
  if(m.topActions)acts+=m.topActions();
  $('#view-actions').innerHTML=acts;
}
function renderBanner(){
  var b=$('#banner');
  if(!db.settings.seeded||db.settings.seenIntro){b.innerHTML='';return;}
  b.innerHTML='<div class="banner"><span>已预置示例数据（基于 2026-10-28 调研成果），方便快速了解各模块——熟悉后可在「数据管理」中一键清空或重置。</span><button data-action="banner-ok">知道了</button></div>';

/* ================= 事件分发 ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;if(el.classList.contains('overlay')&&e.target!==el)return;
  var a=el.getAttribute('data-action');
  if(a==='nav'){go(el.getAttribute('data-nav'));}
  else if(a==='tab'){intelTab=el.getAttribute('data-tab');renderView();}
  else if(a==='add'){var m=currentModule();openForm(modFields(m),null,m.formOpts||{});}
  else if(a==='edit'){var row=curCollection().filter(function(x){return x.id===el.getAttribute('data-id');})[0];if(row)openForm(modFields(currentModule()),row,currentModule().formOpts||{});}
  else if(a==='del'){var r2=curCollection().filter(function(x){return x.id===el.getAttribute('data-id');})[0];if(r2)confirmBox('删除这条记录？删除后不可恢复。',function(){var k=modColKey(currentModule());db[k]=db[k].filter(function(x){return x.id!==r2.id;});save();refresh();toast('已删除');},true);}
  else if(a==='close'){closeModal();}
  else if(a==='confirm-yes'){var cb=pendingConfirm;pendingConfirm=null;closeModal();if(cb)cb();}
  else if(a==='confirm-no'){pendingConfirm=null;closeModal();}
  else if(a==='save'){saveForm();}
  else if(a==='banner-ok'){db.settings.seenIntro=true;save();renderBanner();}
  else if(CUSTOM_ACTIONS[a]){CUSTOM_ACTIONS[a](el);}
});

function kpi(num,label,cls){return '<div class="kpi '+(cls||'')+'"><div class="num">'+num+'</div><div class="lab">'+esc(label)+'</div></div>';}
function renderDashboard(){
  var ops=db.projects.filter(function(p){return p.stage==='已部署'||p.stage==='运营中';}).length;
  var totalA=db.assets.length,depA=db.assets.filter(function(a){return a.status==='已部署';}).length;
  var openT=db.tickets.filter(function(t){return t.status!=='已闭环';}).length;
  var mp=todayStr().slice(0,7);
  var monthTasks=db.tasks.filter(function(t){return String(t.date||'').slice(0,7)===mp;}).length;
  var util=totalA?Math.round(depA/totalA*100):0;
  var h='<div class="kpi-grid">'
    +kpi(ops,'运营中项目（已部署+运营中）','good')
    +kpi(util+'<small>%</small>','资产利用率（'+depA+'/'+totalA+'台部署中）',util>=50?'good':'warn')
    +kpi(monthTasks,'本月任务数','')
    +kpi(openT,'未闭环工单',openT?'danger':'good')
    +'</div>';
  var counts=STAGES.map(function(s){return db.projects.filter(function(p){return p.stage===s;}).length;});
  var max=Math.max.apply(null,counts.concat([1]));
  var shelved=db.projects.filter(function(p){return p.stage==='搁置';}).length;
  h+='<div class="grid2"><div class="card"><h3>项目漏斗 <span class="hint">商机立项按阶段统计</span></h3>';
  h+=STAGES.map(function(s,i){return '<div class="funnel-row"><span class="fl">'+s+'</span><div class="fbar"><i style="width:'+Math.round(counts[i]/max*100)+'%"></i></div><span class="fv">'+counts[i]+'</span></div>';}).join('');
  h+='<div style="font-size:11px;color:var(--text2);margin-top:8px">另有搁置项目 '+shelved+' 个，未计入漏斗</div></div>';
  var warns=[];
  db.assets.forEach(function(a){var d=daysUntil(a.warrantyEnd);if(d!=null&&d<=30)warns.push({c:'amber',t:'维保',x:a.sn+'（'+a.model+'）'+(d<0?'已过期 '+(-d)+' 天':'还剩 '+d+' 天')});});
  db.tickets.forEach(function(t){if(t.status!=='已闭环')warns.push({c:'red',t:'工单',x:t.no+'｜'+t.type+'·'+(t.priority||'中')+'｜'+String(t.desc||'').slice(0,22)});});
  h+='<div class="card"><h3>待办提醒 <span class="hint">30天内维保到期 + 未闭环工单</span></h3>';
  h+=(warns.length?'<ul class="plain-list">'+warns.slice(0,8).map(function(w){return '<li><span class="chip c-'+w.c+'">'+w.t+'</span><span style="flex:1">'+esc(w.x)+'</span></li>';}).join('')+'</ul>':'<div class="empty" style="padding:20px">一切正常：无到期维保、无未闭环工单</div>');
  h+='</div></div>';
  var ev=db.events.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});
  h+='<div class="grid2"><div class="card"><h3>最近情报 <span class="hint">来自情报中心</span></h3><ul class="plain-list">'+ev.map(function(e2){return '<li><span class="d">'+esc(e2.date)+'</span><span style="flex:1">'+esc(e2.company)+'：'+esc(e2.title)+'</span>'+chipCat(e2.category)+'</li>';}).join('')+'</ul></div>';
  var ac={};db.assets.forEach(function(a){ac[a.status]=(ac[a.status]||0)+1;});
  h+='<div class="card"><h3>资产状态</h3><ul class="plain-list">'+ASSET_STATUS.map(function(s){return '<li><span style="flex:1">'+chip(s)+'</span><strong style="font-variant-numeric:tabular-nums">'+(ac[s]||0)+'</strong><span class="dim">台</span></li>';}).join('')+'</ul></div></div>';
  $('#view').innerHTML=h;

function exportData(){
  try{
    var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='具身智能系统备份-'+todayStr()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    toast('已导出备份文件');
  }catch(e){toast('导出失败：'+e.message);}
}
function importFile(input){
  var f=input.files&&input.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(!d||typeof d!=='object'||!d.settings)throw new Error('format');
      ['competitors','events','projects','selections','assets','deployments','tasks','tickets','reviews'].forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];});
      db=d;save();refresh();toast('导入成功');
    }catch(e){toast('导入失败：不是有效的备份文件');}
    input.value='';
  };
  fr.readAsText(f);
}

function actSummary(el){
  var r=db.reviews.filter(function(x){return x.id===el.getAttribute('data-id');})[0];if(!r)return;
  var roi=(r.revenue&&r.cost)?Math.round((Number(r.revenue)-Number(r.cost))/Number(r.cost)*100)+'%':'—';
  var txt='【复盘小结】'+r.projectName+' · '+r.period+'\n任务/场次：'+(r.tasks!=null&&r.tasks!==''?r.tasks:'—')+' 次\n收入：¥'+fmtNum(r.revenue)+' ｜ 成本：¥'+fmtNum(r.cost)+' ｜ ROI：'+roi+'\n故障：'+(r.incidents!=null&&r.incidents!==''?r.incidents:'—')+' 次\n结论与经验：'+(r.conclusion||'待补充');
  lastSummary=txt;
  $('#modal-root').innerHTML='<div class="overlay" data-action="close"><div class="dialog" style="width:min(520px,94vw)"><div class="dlg-head"><span>复盘小结 · 可直接复制</span><button class="x" data-action="close">✕</button></div><div class="dlg-body"><textarea id="sumtxt" style="width:100%;min-height:180px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.8" readonly>'+esc(txt)+'</textarea></div><div class="dlg-foot"><button class="btn" data-action="close">关闭</button><button class="btn btn-primary" data-action="do-copy">复制</button></div></div></div>';
}
function actCopy(){
  var ok=false,ta=$('#sumtxt');
  if(ta){ta.focus();ta.select();try{ok=document.execCommand('copy');}catch(e){}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastSummary);ok=true;}
  toast(ok?'已复制到剪贴板':'请手动选中文本复制（Ctrl/Cmd+C）');
}

/* ================= 自定义动作注册 ================= */
CUSTOM_ACTIONS['do-export']=exportData;
CUSTOM_ACTIONS['do-import']=function(){$('#impfile').click();};
CUSTOM_ACTIONS['do-reseed']=function(){confirmBox('将清空当前全部数据并恢复为示例数据，确定？',function(){db=seedDb();save();refresh();toast('已恢复示例数据');},true);};
CUSTOM_ACTIONS['do-wipe']=function(){confirmBox('将清空全部数据（不可恢复）。建议先导出备份。确定继续？',function(){db=emptyDb();db.settings.seenIntro=true;save();refresh();toast('已清空全部数据');},true);};
CUSTOM_ACTIONS['do-save-org']=function(){db.settings.orgName=$('#org-input').value.trim();save();toast('已保存');};
CUSTOM_ACTIONS['summary']=actSummary;
CUSTOM_ACTIONS['do-copy']=actCopy;
/* ================= 启动 ================= */
load();
renderNav();
go('dashboard');
</script>
