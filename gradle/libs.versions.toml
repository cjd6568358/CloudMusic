# CloudMusic · version catalog（docs/03-12 §1.2 的 2.x / 8.x 占位已钉死）
# 锁定依据：AGP 8.9.2 官方兼容表 —— Gradle 最低/默认 8.11.1、JDK 17、
# SDK Build Tools 35.0.0、支持的最高 API 35，与本项目 compileSdk/targetSdk=35 一致。
# Kotlin 2.1.0 + KSP 2.1.0-1.0.29 为同一 Kotlin 版本的配对发行。
# 多人协作：本文件只钉死「版本号」，不含任何 SDK / JDK / 项目绝对路径。
# 各成员通过 ANDROID_HOME 或本地 local.properties 提供 SDK 位置，见 local.properties.example。

[versions]
gradle = "8.11.1"
agp = "8.9.2"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
java = "17"
compileSdk = "35"
minSdk = "26"
targetSdk = "35"
ndk = "27.0.12077973"
buildTools = "35.0.0"

coroutines = "1.9.0"
serialization = "1.7.3"
javaxInject = "1"
hilt = "2.55"
room = "2.7.1"
okhttp = "4.12.0"
coil = "2.7.0"
nanohttpd = "2.3.1"
composeBom = "2025.01.00"
junitJupiter = "5.11.4"
mockk = "1.13.16"

[libraries]
# 构建插件自身（build-logic convention plugins 用 compileOnly 引用）
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# 纯 Kotlin 契约层（本轮落地）
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }

# Android / 业务侧（后续模块落地时启用，坐标先钉死）
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
androidx-media = { module = "androidx.media:media", version = "1.7.0" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.1.2" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

# 测试（契约层用 JVM 单测，不需要 Android 设备）
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# 约定插件（build-logic included build 提供）
cloudmusic-jvm-library = { id = "cloudmusic.jvm.library" }
cloudmusic-android-library = { id = "cloudmusic.android.library" }
cloudmusic-android-application = { id = "cloudmusic.android.application" }
